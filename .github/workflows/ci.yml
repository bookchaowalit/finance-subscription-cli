# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python) and a current release.
        python-version: ["3.10", "3.13"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      # Local CLI with no runtime image (stdlib only). Installs from uv.lock (uv sync --frozen --all-extras);
      # ruff, mypy, pytest come from the dev extra. Tests are offline (HTTP mocked, temp files only);
      # no Google credentials are needed.
      python-version: ${{ matrix.python-version }}
      # Ratchet: measured 57.96% on 2026-10-22 (ADR-0004: threshold = measured, rounded down).
      # The Gmail/Calendar adapters and the CLI are the untested part; raise it as tests grow.
      coverage-threshold: "57"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
