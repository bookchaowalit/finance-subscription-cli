[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subscription-intelligence"
version = "0.1.0"
description = "Read-only subscription intelligence from Gmail + Calendar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Dev tools only; the CLI itself stays stdlib-only.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
subscription-intel = "subscription_intelligence.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Correctness-focused set.
select = ["E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
# Gradual: bodies are checked without requiring annotations everywhere; tighten module by module.
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
